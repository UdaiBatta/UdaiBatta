<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
  <title id="title">Udai Batta featured projects</title>
  <desc id="desc">Six pixel-style project cards for LedgerLens, Monika Engineers ERP, Shunya API Automation, Monika Engineers website, ASL Detector, and Udai's portfolio.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151c31"/><stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <style>
      .card{fill:url(#card);stroke:#293653;stroke-width:2}.title{fill:#f0f6fc;font:700 22px Consolas,monospace}.type{font:13px Consolas,monospace}.body{fill:#b8c1cf;font:14px Consolas,monospace}.tag{fill:#dbeafe;font:12px Consolas,monospace;text-anchor:middle}.tagbox{fill:#19263d}.icon{fill:none;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter}
    </style>
  </defs>

  <rect width="1000" height="820" rx="24" fill="#080c16"/>
  <rect x="2" y="2" width="996" height="816" rx="22" fill="none" stroke="url(#frame)" stroke-width="4"/>
  <g fill="#00d9ff" opacity=".22">
    <rect x="28" y="28" width="8" height="8"/><rect x="44" y="28" width="8" height="8"/><rect x="60" y="28" width="8" height="8"/>
    <rect x="932" y="784" width="8" height="8"/><rect x="948" y="784" width="8" height="8"/><rect x="964" y="784" width="8" height="8"/>
  </g>
  <text x="50" y="55" fill="#8b949e" font-family="Consolas,monospace" font-size="15">FEATURED PROJECT DIRECTORY</text>
  <text x="950" y="55" fill="#22c55e" font-family="Consolas,monospace" font-size="14" text-anchor="end">● 6 BUILDS ONLINE</text>

  <g transform="translate(38 82)">
    <rect class="card" width="448" height="210" rx="16"/><rect width="8" height="210" rx="4" fill="#00d9ff"/>
    <rect x="28" y="26" width="44" height="44" rx="8" fill="#00d9ff" opacity=".14"/>
    <path class="icon" stroke="#00d9ff" d="M39 43h22v17H39zM44 48h12M44 55h8"/>
    <text class="title" x="88" y="45">LedgerLens</text><text class="type" x="88" y="67" fill="#00d9ff">FINANCIAL RECONCILIATION</text>
    <text class="body" x="28" y="106">Evidence-first matching across payments,</text><text class="body" x="28" y="129">settlements, banks and accounting ledgers.</text>
    <g><rect class="tagbox" x="28" y="158" width="64" height="27" rx="5"/><text class="tag" x="60" y="176">REACT</text><rect class="tagbox" x="102" y="158" width="70" height="27" rx="5"/><text class="tag" x="137" y="176">DJANGO</text><rect class="tagbox" x="182" y="158" width="76" height="27" rx="5"/><text class="tag" x="220" y="176">FINTECH</text></g>
  </g>

  <g transform="translate(514 82)">
    <rect class="card" width="448" height="210" rx="16"/><rect width="8" height="210" rx="4" fill="#a78bfa"/>
    <rect x="28" y="26" width="44" height="44" rx="8" fill="#a78bfa" opacity=".14"/>
    <path class="icon" stroke="#a78bfa" d="M39 58V42h22v16M45 58V48h10v10"/>
    <text class="title" x="88" y="45">Monika ERP / CRM</text><text class="type" x="88" y="67" fill="#a78bfa">INDUSTRIAL OPERATIONS</text>
    <text class="body" x="28" y="106">Enquiry-to-order-to-workshop workflows</text><text class="body" x="28" y="129">with quotations, projects and handoffs.</text>
    <g><rect class="tagbox" x="28" y="158" width="100" height="27" rx="5"/><text class="tag" x="78" y="176">TYPESCRIPT</text><rect class="tagbox" x="138" y="158" width="70" height="27" rx="5"/><text class="tag" x="173" y="176">DJANGO</text><rect class="tagbox" x="218" y="158" width="94" height="27" rx="5"/><text class="tag" x="265" y="176">POSTGRES</text></g>
  </g>

  <g transform="translate(38 316)">
    <rect class="card" width="448" height="210" rx="16"/><rect width="8" height="210" rx="4" fill="#f59e0b"/>
    <rect x="28" y="26" width="44" height="44" rx="8" fill="#f59e0b" opacity=".14"/>
    <path class="icon" stroke="#f59e0b" d="M39 42h22v18H39zM44 48h13M44 54h8"/>
    <text class="title" x="88" y="45">Shunya API Testing</text><text class="type" x="88" y="67" fill="#fbbf24">AUTOMATED QUALITY ENGINEERING</text>
    <text class="body" x="28" y="106">Functional, load and stress tests with</text><text class="body" x="28" y="129">live metrics plus HTML and PDF reports.</text>
    <g><rect class="tagbox" x="28" y="158" width="70" height="27" rx="5"/><text class="tag" x="63" y="176">PYTHON</text><rect class="tagbox" x="108" y="158" width="62" height="27" rx="5"/><text class="tag" x="139" y="176">FLASK</text><rect class="tagbox" x="180" y="158" width="62" height="27" rx="5"/><text class="tag" x="211" y="176">REDIS</text></g>
  </g>

  <g transform="translate(514 316)">
    <rect class="card" width="448" height="210" rx="16"/><rect width="8" height="210" rx="4" fill="#22c55e"/>
    <rect x="28" y="26" width="44" height="44" rx="8" fill="#22c55e" opacity=".14"/>
    <path class="icon" stroke="#22c55e" d="M39 42h22v18H39zM39 48h22M45 54h10"/>
    <text class="title" x="88" y="45">Monika Engineers</text><text class="type" x="88" y="67" fill="#4ade80">INDUSTRIAL WEB EXPERIENCE</text>
    <text class="body" x="28" y="106">Responsive catalogue and services site</text><text class="body" x="28" y="129">for industrial automation products.</text>
    <g><rect class="tagbox" x="28" y="158" width="64" height="27" rx="5"/><text class="tag" x="60" y="176">REACT</text><rect class="tagbox" x="102" y="158" width="92" height="27" rx="5"/><text class="tag" x="148" y="176">JAVASCRIPT</text><rect class="tagbox" x="204" y="158" width="56" height="27" rx="5"/><text class="tag" x="232" y="176">VITE</text></g>
  </g>

  <g transform="translate(38 550)">
    <rect class="card" width="448" height="210" rx="16"/><rect width="8" height="210" rx="4" fill="#ec4899"/>
    <rect x="28" y="26" width="44" height="44" rx="8" fill="#ec4899" opacity=".14"/>
    <path class="icon" stroke="#ec4899" d="M42 60V43M48 60V38M54 60V42M60 60V47M39 55c0 8 5 12 12 12s10-4 10-10"/>
    <text class="title" x="88" y="45">ASL Detector</text><text class="type" x="88" y="67" fill="#f472b6">COMPUTER VISION + ACCESSIBILITY</text>
    <text class="body" x="28" y="106">Real-time ASL letters and phrases to</text><text class="body" x="28" y="129">text and speech using hand landmarks.</text>
    <g><rect class="tagbox" x="28" y="158" width="70" height="27" rx="5"/><text class="tag" x="63" y="176">OPENCV</text><rect class="tagbox" x="108" y="158" width="94" height="27" rx="5"/><text class="tag" x="155" y="176">MEDIAPIPE</text><rect class="tagbox" x="212" y="158" width="50" height="27" rx="5"/><text class="tag" x="237" y="176">SVM</text></g>
  </g>

  <g transform="translate(514 550)">
    <rect class="card" width="448" height="210" rx="16"/><rect width="8" height="210" rx="4" fill="#38bdf8"/>
    <rect x="28" y="26" width="44" height="44" rx="8" fill="#38bdf8" opacity=".14"/>
    <path class="icon" stroke="#38bdf8" d="M39 42h22v18H39zM39 48h22M44 55h12"/>
    <text class="title" x="88" y="45">Developer Portfolio</text><text class="type" x="88" y="67" fill="#38bdf8">PERSONAL WEB EXPERIENCE</text>
    <text class="body" x="28" y="106">A focused showcase of projects, skills</text><text class="body" x="28" y="129">and the engineering behind each build.</text>
    <g><rect class="tagbox" x="28" y="158" width="56" height="27" rx="5"/><text class="tag" x="56" y="176">HTML</text><rect class="tagbox" x="94" y="158" width="50" height="27" rx="5"/><text class="tag" x="119" y="176">CSS</text><rect class="tagbox" x="154" y="158" width="92" height="27" rx="5"/><text class="tag" x="200" y="176">JAVASCRIPT</text></g>
  </g>

  <text x="500" y="795" fill="#6e7681" font-family="Consolas,monospace" font-size="12" text-anchor="middle">EXPLORE THE BUILDS → UDAIBATTA.GITHUB.IO/UDAI-PORTFOLIO</text>
</svg>

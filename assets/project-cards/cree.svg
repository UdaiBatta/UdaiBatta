  <text x="28" y="87" class="stack">Django | Python | Docker</text><text x="28" y="102" class="body">A partially observable environment where an agent</text><text x="28" y="120" class="body">discovers hidden causal rules and delayed failures.</text><rect x="28" y="174" width="60" height="24" rx="4" fill="#251b42"/><text x="58" y="190" text-anchor="middle" class="tag">Django</text><rect x="96" y="174" width="60" height="24" rx="4" fill="#251b42"/><text x="126" y="190" text-anchor="middle" class="tag">Python</text><rect x="164" y="174" width="60" height="24" rx="4" fill="#251b42"/><text x="194" y="190" text-anchor="middle" class="tag">Docker</text><rect x="232" y="174" width="53" height="24" rx="4" fill="#251b42"/><text x="258.5" y="190" text-anchor="middle" class="tag">HTTP</text>

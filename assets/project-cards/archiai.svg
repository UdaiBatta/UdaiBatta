  <rect x="28" y="27" width="8" height="8" fill="#38bdf8"/><text x="48" y="37" class="title">ArchiAI</text>
  <line x1="28" y1="53" x2="28" y2="78" stroke="#dbeafe" stroke-width="2"/><text x="43" y="68" class="sub">AI-assisted architectural design</text>
  <text x="28" y="87" class="stack">Django/DRF | RAG | Docker</text><text x="28" y="102" class="body">Bylaw-grounded layout workflows with structured</text><text x="28" y="120" class="body">requirements, explainable retrieval and secured APIs.</text><rect x="28" y="174" width="60" height="24" rx="4" fill="#1b2940"/><text x="58.0" y="190" text-anchor="middle" class="tag">Django</text><rect x="96" y="174" width="39" height="24" rx="4" fill="#1b2940"/><text x="115.5" y="190" text-anchor="middle" class="tag">RAG</text><rect x="143" y="174" width="60" height="24" rx="4" fill="#1b2940"/><text x="173.0" y="190" text-anchor="middle" class="tag">Docker</text><rect x="211" y="174" width="46" height="24" rx="4" fill="#1b2940"/><text x="234.0" y="190" text-anchor="middle" class="tag">REST</text>
  <rect x="28" y="210" width="83" height="20" rx="3" fill="#38bdf8"/><text x="69.5" y="224" text-anchor="middle" class="button">View Repo</text>
  <style>.title{fill:#f8fafc;font:700 20px Arial,sans-serif}.sub{fill:#e2e8f0;font:13px Arial,sans-serif}.stack{fill:#38bdf8;font:11px ui-monospace,Consolas,monospace}.body{fill:#cbd5e1;font:13px Arial,sans-serif}.tag{fill:#eef6ff;font:10px ui-monospace,Consolas,monospace}.button{fill:#061019;font:700 10px Arial,sans-serif}</style>

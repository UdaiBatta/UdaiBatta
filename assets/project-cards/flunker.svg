  <text x="28" y="87" class="stack">Django | Bootstrap | SQLite</text><text x="28" y="102" class="body">A Django social platform with user profiles, posts,</text><text x="28" y="120" class="body">follows, likes, comments, search and admin tooling.</text><rect x="28" y="174" width="60" height="24" rx="4" fill="#402214"/><text x="58" y="190" text-anchor="middle" class="tag">Django</text><rect x="96" y="174" width="74" height="24" rx="4" fill="#402214"/><text x="133" y="190" text-anchor="middle" class="tag">Bootstrap</text><rect x="178" y="174" width="60" height="24" rx="4" fill="#402214"/><text x="208" y="190" text-anchor="middle" class="tag">SQLite</text><rect x="246" y="174" width="46" height="24" rx="4" fill="#402214"/><text x="269" y="190" text-anchor="middle" class="tag">HTML</text>
